<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <filter id="cp-blur-heavy"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="cp-blur-med"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="cp-blur-soft"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="cp-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060e1a"/>
      <stop offset="50%" stop-color="#122035"/>
      <stop offset="100%" stop-color="#1e1005"/>
    </linearGradient>
    <radialGradient id="cp-sun" cx="68%" cy="42%">
      <stop offset="0%" stop-color="#c8902a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c8902a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="url(#cp-sky)"/>
  <!-- Golden hour glow -->
  <ellipse cx="218" cy="76" rx="110" ry="85" fill="url(#cp-sun)" filter="url(#cp-blur-heavy)"/>
  <!-- Bokeh circles -->
  <circle cx="38" cy="52" r="28" fill="#c8902a" opacity="0.14" filter="url(#cp-blur-heavy)"/>
  <circle cx="285" cy="32" r="20" fill="#4a8fc0" opacity="0.18" filter="url(#cp-blur-heavy)"/>
  <circle cx="62" cy="138" r="18" fill="#4a8fc0" opacity="0.13" filter="url(#cp-blur-heavy)"/>
  <circle cx="292" cy="125" r="24" fill="#c8902a" opacity="0.11" filter="url(#cp-blur-heavy)"/>
  <circle cx="155" cy="22" r="12" fill="#c8902a" opacity="0.1" filter="url(#cp-blur-heavy)"/>
  <!-- Ground / dark base -->
  <rect x="0" y="128" width="320" height="52" fill="#060810" opacity="0.75"/>
  <!-- Figure silhouette -->
  <rect x="148" y="96" width="9" height="34" fill="#060810"/>
  <circle cx="152" cy="90" r="8" fill="#060810"/>
  <!-- Rim light on figure -->
  <ellipse cx="152" cy="112" rx="14" ry="24" fill="#c8902a" opacity="0.38" filter="url(#cp-blur-soft)"/>
  <!-- Anamorphic lens flare -->
  <rect x="0" y="88" width="320" height="1" fill="#d4c080" opacity="0.28" filter="url(#cp-blur-soft)"/>
  <!-- Letterbox bars -->
  <rect x="0" y="0" width="320" height="22" fill="black"/>
  <rect x="0" y="158" width="320" height="22" fill="black"/>
</svg>
