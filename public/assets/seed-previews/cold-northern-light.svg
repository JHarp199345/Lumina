<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="arctic" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1520"/><stop offset="50%" stop-color="#1a3040"/><stop offset="100%" stop-color="#0d1e2a"/></linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#004050" stop-opacity="0"/><stop offset="30%" stop-color="#007080" stop-opacity="0.4"/><stop offset="60%" stop-color="#4090b0" stop-opacity="0.3"/><stop offset="100%" stop-color="#204060" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="versoft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="320" height="180" fill="url(#arctic)"/>
  <!-- Aurora borealis bands -->
  <rect x="0" y="30" width="320" height="25" fill="url(#aurora)" filter="url(#versoft)"/>
  <rect x="0" y="50" width="320" height="18" fill="#206080" opacity="0.15" filter="url(#versoft)"/>
  <!-- Stars -->
  <circle cx="30" cy="20" r="1" fill="#c8dce8" opacity="0.8"/>
  <circle cx="80" cy="12" r="0.8" fill="#d8e8f0" opacity="0.7"/>
  <circle cx="150" cy="8" r="1.2" fill="#e0eef8" opacity="0.9"/>
  <circle cx="200" cy="18" r="0.9" fill="#c8dce8" opacity="0.6"/>
  <circle cx="260" cy="10" r="1" fill="#d8e8f0" opacity="0.8"/>
  <circle cx="300" cy="25" r="0.7" fill="#c8dce8" opacity="0.5"/>
  <circle cx="50" cy="35" r="0.6" fill="#d0e0ec" opacity="0.5"/>
  <circle cx="180" cy="30" r="0.8" fill="#c8dce8" opacity="0.6"/>
  <!-- Distant mountains / ice shelf -->
  <path d="M0,110 L40,80 L80,100 L130,65 L180,90 L230,70 L280,88 L320,75 L320,110 Z" fill="#0d2030" opacity="0.9"/>
  <path d="M0,110 L40,80 L80,100 L130,65 L180,90 L230,70 L280,88 L320,75" stroke="#4a7890" stroke-width="0.5" fill="none" opacity="0.4"/>
  <!-- Snow field -->
  <rect x="0" y="110" width="320" height="70" fill="#0d1e2c"/>
  <!-- Ice reflection -->
  <ellipse cx="160" cy="115" rx="180" ry="8" fill="#204060" opacity="0.3" filter="url(#soft)"/>
  <!-- Lone figure silhouette -->
  <line x1="160" y1="140" x2="160" y2="110" stroke="#1a2e40" stroke-width="3"/>
  <circle cx="160" cy="107" r="4" fill="#1a2e40"/>
  <!-- Horizon glow -->
  <rect x="0" y="108" width="320" height="4" fill="#4a8090" opacity="0.15" filter="url(#soft)"/>
</svg>
