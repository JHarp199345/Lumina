<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <filter id="df-blur-fog"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="df-blur-med"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="df-blur-soft"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="df-moon" cx="28%" cy="18%">
      <stop offset="0%" stop-color="#b8c8d8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#b8c8d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="df-fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182028" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a2430" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <!-- Dark sky -->
  <rect width="320" height="180" fill="#08080f"/>
  <!-- Moon glow -->
  <ellipse cx="90" cy="32" rx="85" ry="58" fill="url(#df-moon)" filter="url(#df-blur-fog)"/>
  <circle cx="90" cy="32" r="14" fill="#c8d8e8" opacity="0.55" filter="url(#df-blur-med)"/>
  <circle cx="90" cy="32" r="9" fill="#dce8f4" opacity="0.75"/>
  <!-- Fog bank at base -->
  <ellipse cx="160" cy="162" rx="200" ry="38" fill="#1a2838" opacity="0.75" filter="url(#df-blur-fog)"/>
  <ellipse cx="100" cy="148" rx="150" ry="28" fill="#20303e" opacity="0.65" filter="url(#df-blur-fog)"/>
  <!-- Fortress silhouette -->
  <rect x="55" y="68" width="210" height="112" fill="#08090e"/>
  <!-- Left tower -->
  <rect x="50" y="42" width="38" height="82" fill="#08090e"/>
  <rect x="50" y="35" width="9" height="13" fill="#08090e"/>
  <rect x="64" y="35" width="9" height="13" fill="#08090e"/>
  <rect x="78" y="35" width="9" height="11" fill="#08090e"/>
  <!-- Right tower -->
  <rect x="232" y="48" width="33" height="78" fill="#08090e"/>
  <rect x="232" y="41" width="9" height="12" fill="#08090e"/>
  <rect x="246" y="41" width="9" height="12" fill="#08090e"/>
  <rect x="257" y="41" width="8" height="10" fill="#08090e"/>
  <!-- Gate arch -->
  <rect x="138" y="108" width="44" height="72" fill="#0a0c14" rx="2"/>
  <ellipse cx="160" cy="110" rx="22" ry="9" fill="#0a0c14"/>
  <!-- Warm torch glow in gate -->
  <ellipse cx="160" cy="148" rx="16" ry="22" fill="#7a3a08" opacity="0.42" filter="url(#df-blur-med)"/>
  <!-- Fog overlay gradient -->
  <rect width="320" height="180" fill="url(#df-fog)"/>
</svg>
