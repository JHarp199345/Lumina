<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <radialGradient id="fire" cx="50%" cy="80%"><stop offset="0%" stop-color="#c8602a"/><stop offset="40%" stop-color="#8b3510"/><stop offset="100%" stop-color="#1a0800"/></radialGradient>
    <radialGradient id="candle" cx="50%" cy="50%"><stop offset="0%" stop-color="#f0a040"/><stop offset="60%" stop-color="#c06010" stop-opacity="0.5"/><stop offset="100%" stop-color="#400800" stop-opacity="0"/></radialGradient>
    <filter id="smokeblur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="emberblur"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d0502"/><stop offset="100%" stop-color="#1a0a04"/></linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#dark)"/>
  <!-- Background warmth -->
  <ellipse cx="160" cy="160" rx="200" ry="80" fill="#8b2a08" opacity="0.2" filter="url(#smokeblur)"/>
  <!-- Smoke columns -->
  <ellipse cx="100" cy="60" rx="20" ry="50" fill="#2a1808" opacity="0.5" filter="url(#smokeblur)"/>
  <ellipse cx="220" cy="40" rx="15" ry="60" fill="#1e1208" opacity="0.4" filter="url(#smokeblur)"/>
  <ellipse cx="160" cy="20" rx="30" ry="40" fill="#281608" opacity="0.3" filter="url(#smokeblur)"/>
  <!-- Central candle / fire glow -->
  <ellipse cx="160" cy="135" rx="40" ry="30" fill="url(#fire)" opacity="0.8" filter="url(#emberblur)"/>
  <ellipse cx="160" cy="120" rx="20" ry="20" fill="url(#candle)" filter="url(#emberblur)"/>
  <!-- Flame -->
  <path d="M160,110 Q155,95 160,80 Q165,95 160,110" fill="#f0b840" opacity="0.7" filter="url(#emberblur)"/>
  <!-- Floating embers -->
  <circle cx="130" cy="90" r="1.5" fill="#f08020" opacity="0.8" filter="url(#emberblur)"/>
  <circle cx="185" cy="75" r="1" fill="#e07010" opacity="0.7" filter="url(#emberblur)"/>
  <circle cx="145" cy="55" r="1.2" fill="#f09030" opacity="0.6" filter="url(#emberblur)"/>
  <circle cx="175" cy="65" r="0.8" fill="#e08020" opacity="0.5" filter="url(#emberblur)"/>
  <circle cx="120" cy="70" r="1" fill="#f07010" opacity="0.4" filter="url(#emberblur)"/>
  <circle cx="200" cy="85" r="1.5" fill="#e06010" opacity="0.6" filter="url(#emberblur)"/>
  <!-- Dark foreground / hearth edge -->
  <path d="M0,180 L0,150 Q80,140 160,145 Q240,140 320,150 L320,180 Z" fill="#0a0502"/>
  <!-- Side shadows (chiaroscuro) -->
  <rect x="0" y="0" width="60" height="180" fill="#050200" opacity="0.7"/>
  <rect x="260" y="0" width="60" height="180" fill="#050200" opacity="0.7"/>
</svg>
