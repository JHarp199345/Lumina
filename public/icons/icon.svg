<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#071525"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.3"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
  <!-- Sparkle center -->
  <g transform="translate(256,256)" fill="#c9a84c">
    <!-- Vertical beam -->
    <rect x="-3" y="-52" width="6" height="104" rx="3" opacity="0.9"/>
    <!-- Horizontal beam -->
    <rect x="-52" y="-3" width="104" height="6" rx="3" opacity="0.9"/>
    <!-- Diagonal beams -->
    <rect x="-3" y="-36" width="6" height="72" rx="3" opacity="0.5" transform="rotate(45)"/>
    <rect x="-3" y="-36" width="6" height="72" rx="3" opacity="0.5" transform="rotate(-45)"/>
    <!-- Center dot -->
    <circle r="8" fill="#e0c078"/>
  </g>
  <!-- L U M I N A text -->
  <text x="256" y="408" font-family="Georgia, serif" font-size="36" font-weight="normal"
    fill="#c9a84c" text-anchor="middle" letter-spacing="12" opacity="0.85">LUMINA</text>
</svg>
